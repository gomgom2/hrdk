<!doctype html>
<html lang="ko">

<head>
	<title>HDRK</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<meta property="og:title" content="HDRK - 한국산업인력공단">
	<meta property="og:description" content="한국산업인력공단 웹매거진">
	<meta property="og:image" content="contents/thumb.jpg">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<link rel="stylesheet" type="text/css" href="css/common.css" />
	<link rel="stylesheet" type="text/css" href="css/hrdk_sub.css" />
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
	<script src="js/script.js"></script>
	<style>
		:root {
			--color-first: #55AE94;
			--color-second: #CEDB00;
			--color-third: #000;
			--color-fourth: #000;
		}

		body {
			background-color: var(--color-first);
		}

		.article-body {
			max-width: 1200px;
			padding-top: 120px;
		}

		.category {
			display: block;
			width: fit-content;
			font-size: 0.8rem;
			line-height: 1.6rem;
			font-family: GmarketSansMedium;
			padding: 0px 12px;
			border: 1px solid var(--color-third);
			color: var(--color-third);
			border-radius: .8rem;
			margin-bottom: 1rem;
		}

		.infographic-box {
			display: grid;
			grid-template-columns: 1fr 1.225fr;
			position: relative;
		}

		.infographic-box-left p {
			color: var(--color-fourth);
			margin-bottom: 1rem;
			width: 90%
		}

		.infographic-box-left h4 {
			color: var(--color-second);
			font-family: Paperlogy-5Medium;
			font-size: 1.5rem;
		}

		.infographic-box-left h2 {
			color: var(--color-third);
			font-family: Paperlogy-7Bold;
			font-size: 2.8rem;
			letter-spacing: -0.01rem;
			line-height: 1.1;
			margin-top: .5rem
		}

		.infographic-box-left .article-meta {
			text-align: left;
			font-size: 0.8rem;
			color: var(--color-third);
			margin-top: 1rem;
		}

		.infographic-box-left figure {
			margin-top: -6rem;
		}

		.infographic-box-right {
			margin-top: 5rem;
		}

		.infographic-box-center {
			position: absolute;
			left: 50%;
			bottom: 0;
			width: 20%;
			transform: translateX(-90%);
		}

		@media (max-width:767px) {
			.article-body {
				padding-top: 20px;
			}

			.infographic-box {
				display: flex;
				flex-direction: column;
			}

			.infographic-box-center {
				right: 0;
				left: auto;
				top: 40%;
				bottom: auto;
				transform: translateX(-10%);
			}

			.infographic-box-right {
				margin-top: 0rem;
			}

			.infographic-box-left h2 {
				font-size: 2rem;
				margin-bottom: 0.5rem;
			}

		}
	</style>
</head>

<body>
	<header id="menu"></header>
	<main>
		<section>
			<div class="article-body wrap">
				<div class="infographic-box">
					<div class="infographic-box-left">
						<span class="category">테마 infographic</span>
						<p>
							한국산업인력공단은 산업현장의 기술 변화와 직무 수행에 필요한 능력(지식·기술·태도)을 국가가 표준화한 기준인, 국가직무능력표준(NCS)을 운영하고 있습니다.
						</p>
						<h4>인포그래픽으로 보는</h4>
						<h2>국가직무능력표준(NCS)<br>개념 및 성과</h2>
						<div class="article-meta">
							<span>글</span>
							<span class="pipe">ㅣ</span>
							<span>최영윤</span>
							<span class="dot">・</span>
							<span>자료</span>
							<span class="pipe">ㅣ</span>
							<span>한국산업인력공단</span>
						</div>
						<figure>
							<img src="contents/sub_12_1.png">
						</figure>
					</div>
					<div class="infographic-box-right">
						<figure>
							<img src="contents/sub_12_2.png">
						</figure>
					</div>
				</div>
			</div>
		</section>
	</main>
	<footer id="footer"></footer>
</body>

</html>
